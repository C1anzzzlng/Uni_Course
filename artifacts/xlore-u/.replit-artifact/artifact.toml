kind = "web"
previewPath = "/"
title = "Xlore U"
version = "1.0.0"
id = "artifacts/xlore-u"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22728

[services.development]
run = "pnpm --filter @workspace/xlore-u run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xlore-u", "run", "build" ]
publicDir = "artifacts/xlore-u/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22728"
BASE_PATH = "/"
